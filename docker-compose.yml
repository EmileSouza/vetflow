services:
  mysql:
    image: mysql:8.4
    container_name: vetflow_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: vetflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: vetflow
      MYSQL_PASSWORD: vetflow

    ports:
      - "3306:3306"

    volumes:
      - vetflow_mysql_data:/var/lib/mysql

volumes:
  vetflow_mysql_data: